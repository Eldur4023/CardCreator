<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Creator</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body, html { height: 100%; overflow: hidden; }

        #landing {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            background: var(--bg);
        }

        .landing-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .landing-title {
            font-family: belerenb, sans-serif;
            font-size: 52px;
            letter-spacing: 3px;
            color: var(--selected);
            text-shadow: 0 0 40px rgba(174, 232, 135, 0.25);
        }

        .landing-subtitle {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .landing-divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .landing-btn {
            font-family: belerenb, sans-serif;
            font-size: 16px;
            letter-spacing: 2px;
            padding: 16px 48px;
            background: var(--accent);
            border: 1px solid var(--accent-hover);
            border-radius: var(--radius);
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
            box-shadow: 0 4px 24px rgba(53, 96, 62, 0.35);
        }

        .landing-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 32px rgba(74, 128, 85, 0.5);
            transform: translateY(-1px);
        }

        .landing-btn:active {
            transform: translateY(0);
        }

        .landing-footer {
            position: absolute;
            bottom: 24px;
            font-size: 11px;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div id="landing">
    <div class="landing-logo">
        <div class="landing-title">Card Creator</div>
        <div class="landing-divider"></div>
        <div class="landing-subtitle">Custom Card Design Tool</div>
    </div>

    <div style="display:flex;gap:16px;align-items:center">
        <a class="landing-btn" href="/editor.html">Create a Card</a>
        <a class="landing-btn" href="/cards.html" style="background:#1e2e1e;border-color:var(--accent);box-shadow:none;font-size:14px;padding:14px 36px">View Cards</a>
    </div>

    <div class="landing-footer">Card Creator &mdash; Fan-made tool</div>
</div>
</body>
</html>
